[project]
name = "buildwindow"
version = "0.2.2"
description = "Deterministic weather-window planning engine as an MCP server: bring your own weather limits"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies of the MCP server only -- this is what `uvx` installs.
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0",
]

[project.scripts]
buildwindow-server = "server.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]
# The reference agent (agent/, scripts/list_tools.py) is a repo-only client.
# Kept out of the package's dependencies so installing the server does not
# pull the Claude Agent SDK; `uv sync` in the repo still installs it.
agent = [
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0",
]

[tool.uv]
default-groups = ["dev", "agent"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
